name: Deploy Backend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack source code
        run: tar czf source.tar.gz --warning=no-file-changed --exclude=.git --exclude=build .

      - name: Upload source to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "source.tar.gz"
          target: "/root"

      - name: Unpack & rebuild
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e
            mkdir -p /root/my-backend
            tar xzf /root/source.tar.gz -C /root/my-backend
            cd /root/my-backend
            chmod +x ./gradlew
            ./gradlew buildFatJar --no-daemon
            cp build/libs/backend-all.jar /root/backend-all.jar
            systemctl restart myapp
            sleep 3
            systemctl is-active myapp