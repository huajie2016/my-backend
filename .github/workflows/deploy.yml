name: Deploy Backend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Tell server to pull & rebuild
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e
            cd /root/my-backend
            git fetch origin main
            git reset --hard origin/main
            chmod +x ./gradlew
            ./gradlew buildFatJar --no-daemon
            cp build/libs/backend-all.jar /root/backend-all.jar
            systemctl restart myapp
            sleep 5
            systemctl is-active myapp